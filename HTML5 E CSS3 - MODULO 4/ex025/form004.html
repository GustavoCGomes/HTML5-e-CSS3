<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>

  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }
    fieldset {
      width: 400px;
    }
  </style>
</head>
<body>
  <h1>Exemplo de Formulário</h1>
  <form action="cadastro.jh" method="get">
    <fieldset>
      <legend>Dados pessoais</legend>
      <p>
        <label for="iemail">E-mail</label>
        <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="Digite seu e-mail">
      </p>
      <p>
        <label for="itel">Telefone</label>
        <input type="tel" name="tel" id="itel" autocomplete="tel"  pattern="ˆ\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx) xxxxx-xxxx" >
      </p>
    </fieldset>
    <!-- Estudar mais sobre RegEx-->
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
  </form>
</body>
</html>
