<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexible Box</title>
  <style>
    div.conteiner {
      background-color: lightsalmon;
      height: 300px;

      display: flex;
      /*
        flex-direction: row-reverse;
        flex-wrap: wrap-reverse;
      */
      flex-flow: row nowrap;
      justify-content: space-between;
      align-items: stretch;
      
    }

    div.item {
      background-color: lightblue;
      border: 1px solid black;
      text-align: center;
      
    }
  </style>
</head>
<body>
  <div class="conteiner">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
  </div>

  <!--
  Direções da flex-box - 
  flex-direction:
  row; 
  main-axis (da esquerda para a direita) cross-axis (de cima para baixo)

  row-reverse;
  main-axis (da direita para a esquerda) cross-axis (de cima para baixo)

  column;
  cross-axis (da esquerda para a direita) main-axis (de cima para baixo)

  column reverse;
  cross-axis (da direita para a esquerda) main-axis (de baixo para cima)
  -->

  <!--
  flex-wrap: nowrap - na quebra
  flex-wrap: wrap - segue o cross-axis
  flex-wrap: wrap-reverse - segue a direção contraria do eixo transversal
  -->

  <!--
    justify-content vai ser o alinhamento do main-axis
    flex-start - comeca main-start
    flex-end - comeca no main-end
    center - fica centralizado no centro

    space-between - coloca no main-star e main-end e tudo que estiver no centro tera o mesmo espacamento. 
    space-evenly - tem o mesmo espaco entre eles
    space-around - centraliza os itens dentro do espaco 

    cross-axis
    align-items
    stretch - vai esticar os elementos
    flex-strart
    center
  -->
</body>
</html>
