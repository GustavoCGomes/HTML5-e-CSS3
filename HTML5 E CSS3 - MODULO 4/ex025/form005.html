<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário</title>
  <style>
    * {
      font-family: Arial, Helvetica, sans-serif;
    }

    fieldset {
      width: 400px;
    }
  </style>
</head>
<body>
  <h1>Exemplo de Formulário</h1>
  <form action="cadastro.js" method="get" autocomplete="on">
    <fieldset>
      <legend>Sexo</legend>
      <input type="radio" name="sexo" id="isxman"> <label for="isxman">Masculino</label>
      <input type="radio" name="sexo" id="isxfem"> <label for="isxfem">Feminino</label>
    </fieldset>
    <fieldset>
      <legend>Esportes Favoritos</legend>
      <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label>
      <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
      <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label>
      <input type="checkbox" name="esten" id="iesten" checked> <label for="iesten">Tênis</label>
    </fieldset>

    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">
    </p>
  </form>
</body>
</html>
