<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexible Box</title>
  <style>
    div.conteiner {
      background-color: lightsalmon;

      display: flex;
      /*
        flex-direction: row-reverse;
        flex-wrap: wrap-reverse;
      */
      flex-flow: row wrap;
      
    }

    div.item {
      background-color: lightblue;
      border: 1px solid black;
      text-align: center;
      flex: auto;
    }
  </style>
</head>
<body>
  <div class="conteiner">
    <div class="item">Exemplo de bloco A</div>
    <div class="item">Exemplo de bloco B</div>
    <div class="item">Exemplo de bloco C</div>
    <div class="item">Exemplo de bloco D</div>
    <div class="item">Exemplo de bloco E</div>
    <div class="item">Exemplo de bloco F</div>
    <div class="item">Exemplo de bloco G</div>
  </div>

  <!--
  Direções da flex-box - 
  flex-direction:
  row; 
  main-axis (da esquerda para a direita) cross-axis (de cima para baixo)

  row-reverse;
  main-axis (da direita para a esquerda) cross-axis (de cima para baixo)

  column;
  cross-axis (da esquerda para a direita) main-axis (de cima para baixo)

  column reverse;
  cross-axis (da direita para a esquerda) main-axis (de baixo para cima)
  -->

  <!--
  flex-wrap: nowrap - na quebra
  flex-wrap: wrap - segue o cross-axis
  flex-wrap: wrap-reverse - segue a direção contraria do eixo transversal
  -->
</body>
</html>
