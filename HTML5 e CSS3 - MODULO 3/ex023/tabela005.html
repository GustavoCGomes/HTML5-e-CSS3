<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio de Tabela</title>

  <style>
    body {
       font-family: Arial, Helvetica, sans-serif;
    }

    table {
      border-collapse: collapse;
      width: 500px;
    }

    caption {
      font-size: 1.5em;
      font-weight: bolder;
      padding: 10px;
    }

    th, td { 
      border: 1px solid black;
      padding: 8px;
    }

    col.csexo {
      background-color: yellow;
    }

    col.cgrupo {
      background-color: red;
    }

  </style>
</head>
<body>
  <h1>Exercício de Tabela</h1>

  <table>
    <colgroup>
      <col class="cnome">
      <col class="csexo">
      <col class="cgrupo" span="2">
      <col class="cprof">
    </colgroup>

    <caption>Cadastro</caption>

    <tr>
      <th scope="col">Nome</th>
      <th scope="col">Sexo</th>
      <th scope="col">Idade</th>
      <th scope="col">Profissao</th>
    </tr>

    <tr>
      <td>Ana Maria</td>
      <td>F</td>
      <td>25</td>
      <td>Jornalista</td>
    </tr>

    <tr>
      <td>Gustavo</td>
      <td>M</td>
      <td>31</td>
      <td>Consultor</td>
    </tr>

    <tr>
      <td>Matheus</td>
      <td>M</td>
      <td>30</td>
      <td>Mecanino</td>
    </tr>

    <tr>
      <td>Izabela</td>
      <td>F</td>
      <td>32</td>
      <td>Biomedica</td>
    </tr>

    <tr>
      <td>Rafael</td>
      <td>M</td>
      <td>31</td>
      <td>Fiscal</td>
    </tr>
  </table>
</body>
</html>
