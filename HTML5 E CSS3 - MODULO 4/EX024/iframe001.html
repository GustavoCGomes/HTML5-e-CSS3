<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo de iframe</title>
</head>
<body>
  <h1>Testando o uso de iframe</h1>
  <p>Acessando o site do 
    <!-- Tamanho padrão 300x150-->
    <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="no"></iframe>
    para aprender a programar
  </p>

  <p>
    O site do 
    <iframe src="https//www.google.com.br" frameborder="0"></iframe> 
    também é muito legal, pena que não funciona dentro do iframe!
  </p>

  <p>
    O repositório do Gomes
    <iframe src="https://github.com/GustavoCGomes" frameborder="0">
      <a href="https://github.com/GustavoCGomes" target="_blank">no GitHub</a>
    </iframe>
    também é bem legal!
  </p>
</body>
</html>
